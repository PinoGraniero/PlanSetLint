[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plansetlint"
version = "0.1.0"
description = "Check architectural PDF drawing packages before delivery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pypdf>=5,<7"]

[project.scripts]
plansetlint = "plansetlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
